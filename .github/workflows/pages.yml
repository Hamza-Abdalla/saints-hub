name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the single-file site
        run: node scripts/build.mjs
      - name: Check the built script parses
        run: |
          node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const a=s.indexOf('<script type=\"module\">')+23,b=s.lastIndexOf('</script>');require('fs').writeFileSync('dist/check.mjs',s.slice(a,b))"
          node --check dist/check.mjs
          rm dist/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
